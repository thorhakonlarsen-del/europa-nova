name: Policy Context feed

# Runs Mon + Thu 06:00 UTC. Every run commits news.json (the `updated`
# timestamp changes even when nothing new is found), which doubles as the
# repository activity GitHub requires to keep scheduled workflows enabled —
# they are auto-disabled after 60 days without a new commit.
on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Anthropic SDK
        run: npm install --no-save --no-audit --no-fund @anthropic-ai/sdk

      - name: Update news.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is not set."
            exit 1
          fi
          node scripts/update-news.mjs

      - name: Commit and push
        run: |
          git config user.name  "europa-nova-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --staged --quiet; then
            echo "No change to news.json."
          else
            git commit -m "Update policy news feed ($(date -u +%Y-%m-%d))"
            git push
          fi
