<svg width="512" height="512" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Europa Nova">
  <title>Europa Nova</title>
  <!-- EN drawn as geometry, not typeset: the mark is identical on every
       machine whether or not DM Sans is installed. Palette navy-deep
       (#1B2A4A), square corners, letters optically centred on 100,100. -->
  <rect width="200" height="200" fill="#1B2A4A"/>
  <rect x="16" y="16" width="168" height="168" fill="none" stroke="#F7F7F4" stroke-width="6"/>
  <g fill="#F7F7F4">
    <!-- E -->
    <rect x="49" y="63" width="15" height="74"/>
    <rect x="49" y="63" width="44" height="15"/>
    <rect x="49" y="92" width="37" height="14"/>
    <rect x="49" y="122" width="44" height="15"/>
    <!-- N -->
    <rect x="107" y="63" width="15" height="74"/>
    <rect x="136" y="63" width="15" height="74"/>
    <polygon points="107,63 122,63 151,137 136,137"/>
  </g>
</svg>
